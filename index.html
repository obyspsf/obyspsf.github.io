<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#174ea6">
<title>Mapa de negocios</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
<style>
*{box-sizing:border-box}html,body{height:100%;margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:#202124}body{display:flex;flex-direction:column}.top{background:#174ea6;color:white;padding:12px 14px;z-index:500;box-shadow:0 2px 8px #0002}.top h1{font-size:18px;margin:0}.top p{font-size:12px;margin:3px 0 0;opacity:.9}#map{flex:1;min-height:0;width:100%;background:#e8eaed}.actions{display:flex;gap:8px;padding:10px;background:#fff;box-shadow:0 -2px 8px #0001;z-index:500}.btn{border:0;border-radius:10px;padding:12px 14px;font-size:14px;font-weight:650;cursor:pointer;flex:1;background:#174ea6;color:white}.btn.secondary{background:#e8f0fe;color:#174ea6}.status{font-size:12px;line-height:1.4;padding:7px 12px;background:#f8f9fa;border-top:1px solid #dadce0}.status.error{background:#fce8e6;color:#a50e0e}.status.ok{background:#e6f4ea;color:#137333}.leaflet-control-layers{border-radius:10px!important}.leaflet-popup-content{font-size:14px}.leaflet-container{font:14px system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
</style>
</head>
<body>
<header class="top"><h1>Mapa de negocios</h1><p>Vista satelital · capa KML · ubicación del dispositivo</p></header>
<div id="map" aria-label="Mapa interactivo"></div>
<div class="actions"><button class="btn" id="locate">📍 Mi ubicación</button><button class="btn secondary" id="reload">↻ Recargar KML</button></div>
<div id="status" class="status">Preparando mapa…</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script src="https://unpkg.com/@tmcw/togeojson@5.8.1/dist/togeojson.umd.js"></script>
<script>
(() => {
 const statusEl=document.getElementById('status');
 const say=(msg,kind='')=>{statusEl.textContent=msg;statusEl.className='status '+kind;};
 const map=L.map('map',{zoomControl:true}).setView([31.025,-114.84],14);
 // Satélite de Esri (no es Google Maps). El uso está sujeto a las condiciones y límites del proveedor.
 const satellite=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'Tiles © Esri — Source: Esri, Maxar, Earthstar Geographics, and the GIS User Community'}).addTo(map);
 const streets=L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'});
 let kmlLayer=L.geoJSON(null,{style:()=>({color:'#ff3b30',weight:3,opacity:.95,fillColor:'#ffcc00',fillOpacity:.28}),onEachFeature:(feature,layer)=>{let p=feature.properties||{};let rows=Object.entries(p).filter(([k,v])=>v!==null&&v!==''&&typeof v!=='object').map(([k,v])=>`<div><b>${esc(k)}:</b> ${esc(String(v))}</div>`).join('');layer.bindPopup(`<b>${esc(p.name||p.Name||'Polígono de estacionamientos')}</b>${rows}`);}}).addTo(map);
 const overlays={'Polígonos: estacionamientos.kml':kmlLayer};
 L.control.layers({'Satélite':satellite,'Calles':streets},overlays,{collapsed:false,position:'topright'}).addTo(map);
 function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
 // Direct-download endpoint for the shared Drive file. Browser CORS restrictions may prevent direct access.
 const KML_URL='https://drive.google.com/file/d/10gqw4c_rSt7hicmNSVOmTOzCj00xPhBq/view?usp=drive_link';
 async function loadKml(){
   say('Cargando estacionamientos.kml desde Google Drive…');
   try{
     const response=await fetch(KML_URL,{cache:'no-store'});
     if(!response.ok) throw new Error('Google Drive respondió HTTP '+response.status+'.');
     const text=await response.text();
     if(!text.trim().startsWith('<?xml')&&!text.includes('<kml')&&!text.includes('<Placemark')) throw new Error('Drive no entregó contenido KML directo; puede estar mostrando una página de descarga o confirmación.');
     const xml=new DOMParser().parseFromString(text,'text/xml');
     if(xml.querySelector('parsererror')) throw new Error('El archivo recibido no es XML/KML válido.');
     const geo=toGeoJSON.kml(xml);
     if(!geo.features||!geo.features.length) throw new Error('El KML no contiene elementos geográficos reconocibles.');
     kmlLayer.clearLayers();kmlLayer.addData(geo);
     const bounds=kmlLayer.getBounds(); if(bounds.isValid()) map.fitBounds(bounds,{padding:[24,24],maxZoom:19});
     say(`KML cargado: ${geo.features.length} elemento(s). Si no ves el polígono, activa la capa en el selector.`, 'ok');
   }catch(err){
     console.error(err);
     say('No se pudo leer el KML directamente desde Drive. Lo más probable es una restricción de acceso entre dominios (CORS) o una página de confirmación de descarga. El mapa sigue disponible. Para cargarlo automáticamente conservando el archivo en Drive, hará falta un pequeño proxy de Google Apps Script; no necesitas subir el KML cada vez. Detalle: '+err.message,'error');
   }
 }
 document.getElementById('reload').addEventListener('click',loadKml);
 document.getElementById('locate').addEventListener('click',()=>{
   if(!('geolocation' in navigator)){say('Este navegador no ofrece geolocalización.','error');return;}
   if(!window.isSecureContext){say('El GPS requiere abrir esta página desde una dirección HTTPS (por ejemplo GitHub Pages).','error');return;}
   say('Solicitando permiso de ubicación…');
   navigator.geolocation.getCurrentPosition(pos=>{
     const lat=pos.coords.latitude,lon=pos.coords.longitude,acc=Math.round(pos.coords.accuracy);
     map.setView([lat,lon],18);
     if(window.userMarker)map.removeLayer(window.userMarker);if(window.userCircle)map.removeLayer(window.userCircle);
     window.userMarker=L.marker([lat,lon]).addTo(map).bindPopup(`Tu ubicación<br>Precisión aproximada: ${acc} m`).openPopup();
     window.userCircle=L.circle([lat,lon],{radius:acc,color:'#4285f4',fillColor:'#4285f4',fillOpacity:.12,weight:1}).addTo(map);
     say(`Ubicación obtenida. Precisión aproximada: ${acc} metros.`, 'ok');
   },err=>{const messages={1:'Permiso denegado. Autoriza ubicación para este sitio en los ajustes del navegador.',2:'No se pudo determinar la ubicación. Revisa GPS y conexión.',3:'La solicitud de ubicación agotó el tiempo de espera.'};say(messages[err.code]||('Error de ubicación: '+err.message),'error');},{enableHighAccuracy:true,timeout:20000,maximumAge:5000});
 });
 loadKml();
})();
</script>
</body></html>


<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Estacionamientos</title>

    <!-- Leaflet -->
    <link rel="stylesheet"
          href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        #map {
            height: 100%;
            width: 100%;
        }

        .titulo-popup {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 10px;
            color: #222;
        }

        .contenido-popup {
            font-size: 13px;
            line-height: 1.6;
        }

        .estado {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 5px;
            font-weight: bold;
            margin-top: 4px;
        }

        .pagado {
            background: #d4edda;
            color: #155724;
        }

        .no-pagado {
            background: #f8d7da;
            color: #721c24;
        }

        .sin-informacion {
            background: #dbeafe;
            color: #1d4ed8;
        }

        .panel-mensaje {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            background: white;
            padding: 10px 15px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,.25);
            font-size: 13px;
            max-width: 85%;
            text-align: center;
        }

        .boton-ubicacion {
            background: white;
            border: 2px solid rgba(0,0,0,.2);
            border-radius: 5px;
            padding: 8px 12px;
            cursor: pointer;
            font-size: 14px;
        }

        .boton-ubicacion:hover {
            background: #f4f4f4;
        }

        .leyenda {
            background: white;
            padding: 10px;
            line-height: 1.7;
            border-radius: 5px;
            box-shadow: 0 1px 5px rgba(0,0,0,.3);
            font-size: 12px;
        }

        .leyenda span {
            display: inline-block;
            width: 12px;
            height: 12px;
            margin-right: 6px;
            border-radius: 50%;
        }

        .leyenda-verde {
            background: #28a745;
        }

        .leyenda-rojo {
            background: #dc3545;
        }

        .leyenda-azul {
            background: #3388ff;
        }
    </style>
</head>

<body>

<div id="mensaje" class="panel-mensaje">
    Cargando información...
</div>

<div id="map"></div>

<!-- Leaflet -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<!-- Plugin para leer archivos KML -->
<script src="https://unpkg.com/leaflet-omnivore@0.3.4/leaflet-omnivore.min.js"></script>

<script>
    // =========================================
    // CONFIGURACIÓN
    // =========================================

    const SHEET_ID =
        '1LdpC1hhub7cUcSq0EbiLFFKyDwQ68hhl9R4LRNSgqso';

    const SHEET_NAME = 'APPCEL';

    // Archivo KML en la misma carpeta que index.html
    const KML_URL = new URL(
        'estacionamientos.kml',
        window.location.href
    ).href;

    // Datos de contribuyentes
    // Se relacionan mediante el ID del estacionamiento
    let datosContribuyentes = {};

    let capaEstacionamientos = null;
    let ubicacionUsuario = null;

    // =========================================
    // MAPA
    // =========================================

    const mapa = L.map('map').setView(
        [31.02, -114.84],
        15
    );

    // Mapa satelital
    const satelite = L.tileLayer(
        'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
        {
            attribution: 'Tiles &copy; Esri'
        }
    );

    // Mapa de calles
    const calles = L.tileLayer(
        'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
        {
            attribution: '&copy; OpenStreetMap'
        }
    );

    // Vista inicial satelital
    satelite.addTo(mapa);

    // Selector de mapas
    L.control.layers(
        {
            'Satélite': satelite,
            'Calles': calles
        },
        null,
        {
            collapsed: true
        }
    ).addTo(mapa);

    // =========================================
    // MENSAJES
    // =========================================

    function mostrarMensaje(mensaje) {
        const elemento = document.getElementById('mensaje');

        elemento.textContent = mensaje;
        elemento.style.display = 'block';
    }

    function ocultarMensaje() {
        document.getElementById('mensaje').style.display = 'none';
    }

    // =========================================
    // NORMALIZAR ID
    // =========================================

    function normalizarID(valor) {
        if (valor === null || valor === undefined) {
            return '';
        }

        return String(valor).trim();
    }

    // =========================================
    // LEER GOOGLE SHEETS
    // =========================================

    async function cargarDatosSheet() {

        mostrarMensaje('Cargando información de contribuyentes...');

        const url = new URL(
            `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq`
        );

        url.searchParams.set('sheet', SHEET_NAME);
        url.searchParams.set('range', 'A2:D');
        url.searchParams.set('headers', '0');
        url.searchParams.set('tqx', 'out:json');

        const respuesta = await fetch(url.toString());

        if (!respuesta.ok) {
            throw new Error(
                'No se pudo acceder a Google Sheets.'
            );
        }

        const texto = await respuesta.text();

        const inicio = texto.indexOf('{');
        const fin = texto.lastIndexOf('}');

        if (inicio === -1 || fin === -1) {
            throw new Error(
                'Google Sheets devolvió una respuesta inválida.'
            );
        }

        const resultado = JSON.parse(
            texto.substring(inicio, fin + 1)
        );

        if (
            resultado.status !== 'ok' ||
            !resultado.table
        ) {
            throw new Error(
                'No se pudo leer la información de Google Sheets.'
            );
        }

        const registros = {};

        (resultado.table.rows || []).forEach(fila => {

            const celdas = fila.c || [];

            // Columnas:
            // A = ID
            // B = Nombre
            // C = Localización
            // D = Status

            const id = celdas[0]?.v;

            const nombre =
                celdas[1]?.f ??
                celdas[1]?.v ??
                '';

            const localizacion =
                celdas[2]?.f ??
                celdas[2]?.v ??
                '';

            const status =
                celdas[3]?.f ??
                celdas[3]?.v ??
                '';

            const clave = normalizarID(id);

            if (!clave) {
                return;
            }

            registros[clave] = {
                id: clave,
                nombre: String(nombre ?? ''),
                localizacion: String(localizacion ?? ''),
                status: String(status ?? '')
            };
        });

        datosContribuyentes = registros;

        console.log(
            'Contribuyentes cargados:',
            Object.keys(datosContribuyentes).length
        );

        console.log(
            'IDs disponibles:',
            Object.keys(datosContribuyentes)
        );

        return datosContribuyentes;
    }

    // =========================================
    // OBTENER ID DEL POLÍGONO KML
    // =========================================

    function obtenerIdPoligono(feature) {

        const propiedades = feature.properties || {};

        // El nombre del polígono en el KML es su ID.
        // Ejemplo: "1", "2", "3", etc.
        const nombre = propiedades.name ?? '';

        return normalizarID(nombre);
    }

    // =========================================
    // BUSCAR INFORMACIÓN DEL CONTRIBUYENTE
    // =========================================

    function obtenerInformacionPoligono(feature) {

        const id = obtenerIdPoligono(feature);

        return datosContribuyentes[id] || null;
    }

    // =========================================
    // DETERMINAR COLOR DEL POLÍGONO
    // =========================================

    function obtenerColor(status) {

        const estado = String(status || '')
            .trim()
            .normalize('NFD')
            .replace(/[\u0300-\u036f]/g, '')
            .toUpperCase();

        if (
            estado.includes('NO PAGADO') ||
            estado.includes('PENDIENTE') ||
            estado.includes('ADEUDO')
        ) {
            return '#dc3545';
        }

        if (
            estado.includes('PAGADO') ||
            estado.includes('AL CORRIENTE')
        ) {
            return '#28a745';
        }

        return '#3388ff';
    }

    // =========================================
    // ESTILO DE POLÍGONOS
    // =========================================

    function estiloPoligono(feature) {

        const informacion =
            obtenerInformacionPoligono(feature);

        const color = informacion
            ? obtenerColor(informacion.status)
            : '#3388ff';

        return {
            color: color,
            weight: 2,
            opacity: 1,
            fillColor: color,
            fillOpacity: 0.45
        };
    }

    // =========================================
    // CONSTRUIR VENTANA DE INFORMACIÓN
    // =========================================

    function crearPopup(feature) {

        const informacion =
            obtenerInformacionPoligono(feature);

        const contenedor = document.createElement('div');

        contenedor.className = 'contenido-popup';

        // Si no se encuentra el registro
        if (!informacion) {

            const titulo = document.createElement('div');
            titulo.className = 'titulo-popup';
            titulo.textContent = 'Sin información registrada';

            contenedor.appendChild(titulo);

            const aviso = document.createElement('div');
            aviso.className = 'estado sin-informacion';
            aviso.textContent =
                'No se encontró información para este estacionamiento.';

            contenedor.appendChild(aviso);

            // El ID ya no se muestra en el popup.
            return contenedor;
        }

        // =====================================
        // ENCABEZADO:
        // AHORA APARECE DIRECTAMENTE EL NOMBRE
        // =====================================

        const titulo = document.createElement('div');

        titulo.className = 'titulo-popup';

        // Antes decía "Estacionamiento 1"
        // Ahora muestra el nombre del contribuyente
        titulo.textContent =
            informacion.nombre || 'Sin nombre registrado';

        contenedor.appendChild(titulo);

        // =====================================
        // LOCALIZACIÓN
        // =====================================

        const localizacion = document.createElement('div');

        const etiquetaLocalizacion =
            document.createElement('strong');

        etiquetaLocalizacion.textContent = 'Localización: ';

        localizacion.appendChild(etiquetaLocalizacion);

        localizacion.appendChild(
            document.createTextNode(
                informacion.localizacion || 'Sin localización registrada'
            )
        );

        contenedor.appendChild(localizacion);

        // =====================================
        // STATUS
        // =====================================

        const estado = document.createElement('div');

        const etiquetaStatus =
            document.createElement('strong');

        etiquetaStatus.textContent = 'Status: ';

        estado.appendChild(etiquetaStatus);

        const valorStatus =
            document.createElement('span');

        const statusTexto =
            informacion.status || 'SIN STATUS';

        valorStatus.textContent = statusTexto;
        valorStatus.className = 'estado';

        const color = obtenerColor(statusTexto);

        if (color === '#28a745') {
            valorStatus.classList.add('pagado');
        } else if (color === '#dc3545') {
            valorStatus.classList.add('no-pagado');
        } else {
            valorStatus.classList.add('sin-informacion');
        }

        estado.appendChild(valorStatus);

        contenedor.appendChild(estado);

        // IMPORTANTE:
        // No se agrega el ID al cuadro de información.

        return contenedor;
    }

    // =========================================
    // EVENTOS DE CADA POLÍGONO
    // =========================================

    function configurarPoligono(feature, layer) {

        const popup = crearPopup(feature);

        layer.bindPopup(popup, {
            maxWidth: 300
        });

        layer.on('mouseover', function() {

            if (layer.setStyle) {
                layer.setStyle({
                    weight: 4,
                    fillOpacity: 0.65
                });
            }
        });

        layer.on('mouseout', function() {

            if (capaEstacionamientos &&
                capaEstacionamientos.resetStyle) {

                capaEstacionamientos.resetStyle(layer);
            }
        });
    }

    // =========================================
    // CARGAR KML
    // =========================================

    async function cargarEstacionamientos() {

        mostrarMensaje('Cargando estacionamientos...');

        if (capaEstacionamientos) {
            mapa.removeLayer(capaEstacionamientos);
            capaEstacionamientos = null;
        }

        const respuesta = await fetch(KML_URL, {
            cache: 'no-store'
        });

        if (!respuesta.ok) {
            throw new Error(
                'No se pudo cargar estacionamientos.kml. Verifica que esté junto a index.html.'
            );
        }

        const contenidoKML = await respuesta.text();

        const documento = new DOMParser().parseFromString(
            contenidoKML,
            'application/xml'
        );

        if (documento.querySelector('parsererror')) {
            throw new Error(
                'El archivo KML contiene un error de formato.'
            );
        }

        // Se utiliza Omnivore para interpretar el KML.
        // Se crea la capa a partir del contenido descargado.
        capaEstacionamientos = omnivore.kml.parse(
            contenidoKML,
            null,
            L.geoJSON(null, {
                style: estiloPoligono,
                onEachFeature: configurarPoligono
            })
        );

        capaEstacionamientos.addTo(mapa);

        capaEstacionamientos.on('ready', function() {
            ajustarVistaMapa();
        });

        // Ajustar vista si la capa ya contiene geometrías
        ajustarVistaMapa();

        console.log(
            'KML cargado:',
            KML_URL
        );
    }

    // =========================================
    // AJUSTAR VISTA AL ÁREA DE ESTACIONAMIENTOS
    // =========================================

    function ajustarVistaMapa() {

        if (!capaEstacionamientos) {
            return;
        }

        try {
            const limites =
                capaEstacionamientos.getBounds();

            if (limites && limites.isValid()) {
                mapa.fitBounds(limites, {
                    padding: [20, 20]
                });
            }
        } catch (error) {
            console.warn(
                'No se pudieron ajustar los límites:',
                error
            );
        }
    }

    // =========================================
    // BOTÓN DE UBICACIÓN GPS
    // =========================================

    const controlGPS = L.control({
        position: 'topleft'
    });

    controlGPS.onAdd = function() {

        const contenedor =
            L.DomUtil.create('div');

        const boton =
            L.DomUtil.create(
                'button',
                'boton-ubicacion',
                contenedor
            );

        boton.type = 'button';
        boton.textContent = '📍 Mi ubicación';

        L.DomEvent.disableClickPropagation(contenedor);

        boton.onclick = function() {

            if (!navigator.geolocation) {
                alert(
                    'Tu navegador no permite obtener la ubicación.'
                );
                return;
            }

            mostrarMensaje(
                'Obteniendo ubicación GPS...'
            );

            navigator.geolocation.getCurrentPosition(

                function(posicion) {

                    const lat = posicion.coords.latitude;
                    const lng = posicion.coords.longitude;

                    if (ubicacionUsuario) {
                        mapa.removeLayer(ubicacionUsuario);
                    }

                    ubicacionUsuario = L.marker(
                        [lat, lng]
                    ).addTo(mapa);

                    ubicacionUsuario.bindPopup(
                        'Tu ubicación actual'
                    ).openPopup();

                    mapa.setView(
                        [lat, lng],
                        19
                    );

                    ocultarMensaje();
                },

                function(error) {

                    let mensaje =
                        'No se pudo obtener tu ubicación.';

                    if (error.code === 1) {
                        mensaje =
                            'Debes permitir el acceso a la ubicación.';
                    }

                    mostrarMensaje(mensaje);

                    setTimeout(
                        ocultarMensaje,
                        4000
                    );
                },

                {
                    enableHighAccuracy: true,
                    timeout: 15000,
                    maximumAge: 0
                }
            );
        };

        return contenedor;
    };

    controlGPS.addTo(mapa);

    // =========================================
    // BOTÓN PARA RECARGAR INFORMACIÓN
    // =========================================

    const controlRecargar = L.control({
        position: 'topleft'
    });

    controlRecargar.onAdd = function() {

        const contenedor =
            L.DomUtil.create('div');

        const boton =
            L.DomUtil.create(
                'button',
                'boton-ubicacion',
                contenedor
            );

        boton.type = 'button';
        boton.textContent = '🔄 Recargar';

        L.DomEvent.disableClickPropagation(contenedor);

        boton.onclick = function() {
            iniciarCarga();
        };

        return contenedor;
    };

    controlRecargar.addTo(mapa);

    // =========================================
    // LEYENDA
    // =========================================

    const leyenda = L.control({
        position: 'bottomright'
    });

    leyenda.onAdd = function() {

        const div = L.DomUtil.create('div', 'leyenda');

        div.innerHTML = `
            <strong>Estado de estacionamientos</strong><br>
            <span class="leyenda-verde"></span> Pagado<br>
            <span class="leyenda-rojo"></span> No pagado<br>
            <span class="leyenda-azul"></span> Sin información
        `;

        return div;
    };

    leyenda.addTo(mapa);

    // =========================================
    // CARGA GENERAL
    // =========================================

    async function iniciarCarga() {

        mostrarMensaje('Actualizando información...');

        try {

            // Primero cargar Google Sheets
            await cargarDatosSheet();

            // Después cargar los polígonos
            await cargarEstacionamientos();

            mostrarMensaje(
                'Estacionamientos actualizados correctamente.'
            );

            setTimeout(
                ocultarMensaje,
                2500
            );

        } catch (error) {

            console.error(
                'Error al cargar:',
                error
            );

            mostrarMensaje(
                'Error: ' + error.message
            );
        }
    }

    // =========================================
    // INICIAR MAPA
    // =========================================

    iniciarCarga();

</script>

</body>
</html>

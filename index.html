
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Estacionamientos</title>

    <!-- Leaflet -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />

    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: Arial, sans-serif;
        }

        #map {
            width: 100%;
            height: 100%;
        }

        /* Panel de botones */
        .panel-controles {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .panel-controles button {
            border: none;
            border-radius: 6px;
            padding: 10px 14px;
            font-size: 14px;
            font-weight: bold;
            color: white;
            background: #1769aa;
            cursor: pointer;
            box-shadow: 0 2px 6px #0004;
        }

        .panel-controles button:hover {
            background: #105184;
        }

        /* Mensajes */
        #mensaje {
            position: absolute;
            z-index: 1001;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            max-width: 85%;
            padding: 10px 15px;
            border-radius: 6px;
            background: white;
            box-shadow: 0 2px 8px #0004;
            font-size: 13px;
            text-align: center;
            display: none;
        }

        /* Cuadro de información */
        .popup-info {
            min-width: 220px;
            max-width: 320px;
            font-family: Arial, sans-serif;
            overflow-wrap: anywhere;
        }

        .popup-info h3 {
            margin: 0 0 10px 0;
            padding-bottom: 8px;
            border-bottom: 1px solid #ddd;
            color: #222;
            font-size: 17px;
            line-height: 1.3;
        }

        .popup-info p {
            margin: 8px 0;
            font-size: 13px;
            line-height: 1.5;
        }

        .status {
            display: inline-block;
            font-weight: bold;
            padding: 4px 8px;
            border-radius: 4px;
            margin-top: 3px;
        }

        .status-pagado {
            background: #d4edda;
            color: #155724;
        }

        .status-no-pagado {
            background: #f8d7da;
            color: #721c24;
        }

        .status-desconocido {
            background: #e2e3e5;
            color: #383d41;
        }

        .leyenda {
            background: white;
            padding: 10px 12px;
            border-radius: 6px;
            box-shadow: 0 1px 5px #0004;
            line-height: 1.8;
            font-size: 12px;
        }

        .leyenda span {
            display: inline-block;
            width: 12px;
            height: 12px;
            margin-right: 6px;
            border-radius: 2px;
        }

        @media (max-width: 600px) {
            .panel-controles {
                top: 8px;
                right: 8px;
            }

            .panel-controles button {
                padding: 9px 11px;
                font-size: 12px;
            }

            .popup-info {
                min-width: 190px;
            }
        }
    </style>
</head>

<body>

<div id="map"></div>

<div class="panel-controles">
    <button onclick="localizarUsuario()">
        📍 Mi ubicación
    </button>

    <button onclick="recargarDatos()">
        🔄 Recargar datos
    </button>
</div>

<div id="mensaje"></div>

<!-- Leaflet -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<!-- Conversión de KML a GeoJSON -->

<script src="https://cdnjs.cloudflare.com/ajax/libs/togeojson/0.16.0/togeojson.min.js"></script>


<script>
    // =========================================
    // CONFIGURACIÓN
    // =========================================

    const SHEET_ID =
        '1LdpC1hhub7cUcSq0EbiLFFKyDwQ68hhl9R4LRNSgqso';

    const SHEET_NAME = 'APPCELL';

    const KML_URL = new URL(
        'estacionamientos.kml',
        window.location.href
    ).href;

    // Datos de Google Sheets
    let datosContribuyentes = {};

    // Capas
    let capaEstacionamientos = null;
    let capaUbicacion = null;
    let marcadorUsuario = null;

    // Mapa
    const map = L.map('map').setView(
        [24.0, -102.0],
        5
    );

    // =========================================
    // MAPAS BASE
    // =========================================

    const satelite = L.tileLayer(
        'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
        {
            attribution: 'Tiles © Esri',
            maxZoom: 20
        }
    );

    const calles = L.tileLayer(
        'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
        {
            attribution: '&copy; OpenStreetMap contributors',
            maxZoom: 20
        }
    );

    // Vista inicial satelital
    satelite.addTo(map);

    // =========================================
    // CONTROL DE CAPAS
    // =========================================

    L.control.layers(
        {
            'Satélite': satelite,
            'Calles': calles
        },
        {},
        {
            collapsed: true
        }
    ).addTo(map);

    // =========================================
    // LEYENDA
    // =========================================

    const leyenda = L.control({
        position: 'bottomleft'
    });

    leyenda.onAdd = function() {
        const div = L.DomUtil.create('div', 'leyenda');

        div.innerHTML = `
            <strong>ESTATUS</strong><br>
            <span style="background:#28a745"></span>Pagado<br>
            <span style="background:#dc3545"></span>No pagado<br>
            <span style="background:#007bff"></span>Sin información
        `;

        return div;
    };

    leyenda.addTo(map);

    // =========================================
    // MENSAJES
    // =========================================

    function mostrarMensaje(texto) {
        const elemento = document.getElementById('mensaje');

        elemento.textContent = texto;
        elemento.style.display = 'block';
    }

    function ocultarMensaje() {
        document.getElementById('mensaje').style.display = 'none';
    }

    // =========================================
    // NORMALIZAR ID
    // =========================================

    function normalizarID(valor) {
        if (valor === null || valor === undefined) {
            return '';
        }

        return String(valor).trim();
    }

    // =========================================
    // OBTENER ID DEL POLÍGONO KML
    // =========================================

    function obtenerIdPoligono(feature) {
        const propiedades = feature.properties || {};

        // El nombre del polígono KML es el ID:
        // 1, 2, 3, etc.
        const nombre = propiedades.name ?? '';

        return normalizarID(nombre);
    }

    // =========================================
    // CARGAR DATOS DE GOOGLE SHEETS
    // =========================================

    async function cargarDatosSheet() {
        mostrarMensaje('Cargando información de Google Sheets...');

        const url = new URL(
            `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq`
        );

        url.searchParams.set('sheet', SHEET_NAME);
        url.searchParams.set('range', 'A2:D');
        url.searchParams.set('headers', '0');
        url.searchParams.set('tqx', 'out:json');

        const respuesta = await fetch(url.toString());

        if (!respuesta.ok) {
            throw new Error(
                'No se pudo consultar Google Sheets. Verifica los permisos.'
            );
        }

        const texto = await respuesta.text();

        const inicio = texto.indexOf('{');
        const fin = texto.lastIndexOf('}');

        if (inicio === -1 || fin === -1) {
            throw new Error(
                'Google Sheets devolvió una respuesta inválida.'
            );
        }

        const resultado = JSON.parse(
            texto.substring(inicio, fin + 1)
        );

        if (
            resultado.status !== 'ok' ||
            !resultado.table
        ) {
            throw new Error(
                'No se pudo leer la pestaña APPCELL.'
            );
        }

        const registros = {};

        (resultado.table.rows || []).forEach(fila => {
            const celdas = fila.c || [];

            // Columnas:
            // A = ID
            // B = Nombre
            // C = Localización
            // D = Status

            const id = celdas[0]?.v;

            const nombre =
                celdas[1]?.f ??
                celdas[1]?.v ??
                '';

            const localizacion =
                celdas[2]?.f ??
                celdas[2]?.v ??
                '';

            const status =
                celdas[3]?.f ??
                celdas[3]?.v ??
                '';

            const clave = normalizarID(id);

            if (!clave) return;

            registros[clave] = {
                id: clave,
                nombre: String(nombre ?? ''),
                localizacion: String(localizacion ?? ''),
                status: String(status ?? '')
            };
        });

        datosContribuyentes = registros;

        console.log(
            'Registros cargados:',
            Object.keys(datosContribuyentes).length
        );

        console.log(
            'IDs disponibles:',
            Object.keys(datosContribuyentes)
        );

        return datosContribuyentes;
    }

    // =========================================
    // BUSCAR INFORMACIÓN DEL POLÍGONO
    // =========================================

    function obtenerInformacionPoligono(feature) {
        const id = obtenerIdPoligono(feature);

        return datosContribuyentes[id] || null;
    }

    // =========================================
    // COLORES POR STATUS
    // =========================================

    function obtenerColor(info) {
        if (!info) {
            return '#007bff';
        }

        const status = normalizarID(info.status)
            .toUpperCase()
            .normalize('NFD')
            .replace(/[\u0300-\u036f]/g, '');

        if (
            status.includes('NO PAGADO') ||
            status.includes('NO PAGADA') ||
            status.includes('PENDIENTE') ||
            status.includes('ADEUDO')
        ) {
            return '#dc3545';
        }

        if (
            status.includes('PAGADO') ||
            status.includes('PAGADA')
        ) {
            return '#28a745';
        }

        return '#007bff';
    }

    // =========================================
    // ESCAPAR TEXTO PARA HTML
    // =========================================

    function escaparHTML(texto) {
        return String(texto ?? '').replace(/[&<>"']/g, caracter => {
            const entidades = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#39;'
            };

            return entidades[caracter];
        });
    }

    // =========================================
    // CREAR CONTENIDO DEL POPUP
    // =========================================

    function crearPopup(info, id) {
        // Si no hay información
        if (!info) {
            return `
                <div class="popup-info">
                    <h3>Sin información registrada</h3>
                    <p>
                        No se encontró información
                        para este estacionamiento
                        en Google Sheets.
                    </p>
                </div>
            `;
        }

        const nombre = escaparHTML(
            info.nombre || 'Sin nombre'
        );

        const localizacion = escaparHTML(
            info.localizacion || 'Sin localización'
        );

        const statusOriginal = normalizarID(
            info.status || 'SIN ESTATUS'
        ).toUpperCase();

        const status = escaparHTML(statusOriginal);

        const color = obtenerColor(info);

        let claseStatus = 'status-desconocido';

        if (color === '#28a745') {
            claseStatus = 'status-pagado';
        } else if (color === '#dc3545') {
            claseStatus = 'status-no-pagado';
        }

        // IMPORTANTE:
        // El nombre aparece como título.
        // No se muestra el ID.
        // No se muestra "Estacionamiento 1".

        return `
            <div class="popup-info">

                <h3>${nombre}</h3>

                <p>
                    <strong>Localización:</strong><br>
                    ${localizacion}
                </p>

                <p>
                    <strong>Status:</strong><br>
                    <span class="status ${claseStatus}">
                        ${status}
                    </span>
                </p>

            </div>
        `;
    }

    // =========================================
    // ESTILO DE LOS POLÍGONOS
    // =========================================

    function estiloPoligono(feature) {
        const info = obtenerInformacionPoligono(feature);
        const color = obtenerColor(info);

        return {
            color: color,
            weight: 2,
            opacity: 1,
            fillColor: color,
            fillOpacity: 0.45
        };
    }

    // =========================================
    // EVENTOS DE LOS POLÍGONOS
    // =========================================

    function configurarPoligono(feature, layer) {
        const id = obtenerIdPoligono(feature);
        const info = obtenerInformacionPoligono(feature);

        const contenido = crearPopup(info, id);

        layer.bindPopup(contenido);

        layer.on('mouseover', function() {
            this.setStyle({
                weight: 4,
                fillOpacity: 0.65
            });
        });

        layer.on('mouseout', function() {
            if (capaEstacionamientos) {
                capaEstacionamientos.resetStyle(this);
            }
        });
    }

    // =========================================
    // CARGAR KML
    // =========================================

    async function cargarKML() {
        mostrarMensaje('Cargando estacionamientos...');

        const respuesta = await fetch(KML_URL, {
            cache: 'no-store'
        });

        if (!respuesta.ok) {
            throw new Error(
                'No se pudo cargar estacionamientos.kml. Verifica que esté junto a index.html.'
            );
        }

        const textoKML = await respuesta.text();

        const parser = new DOMParser();

        const documento = parser.parseFromString(
            textoKML,
            'text/xml'
        );

        if (
            documento.querySelector('parsererror')
        ) {
            throw new Error(
                'El archivo KML tiene un error de formato.'
            );
        }

        const geojson = toGeoJSON.kml(documento);

        if (
            !geojson.features ||
            geojson.features.length === 0
        ) {
            throw new Error(
                'El KML no contiene estacionamientos.'
            );
        }

        // Eliminar capa anterior
        if (capaEstacionamientos) {
            map.removeLayer(capaEstacionamientos);
        }

        // Crear nueva capa
        capaEstacionamientos = L.geoJSON(
            geojson,
            {
                style: estiloPoligono,
                onEachFeature: configurarPoligono
            }
        ).addTo(map);

        // Ajustar mapa al área de los estacionamientos
        const limites = capaEstacionamientos.getBounds();

        if (limites.isValid()) {
            map.fitBounds(limites, {
                padding: [20, 20],
                maxZoom: 19
            });
        }

        console.log(
            'Estacionamientos cargados:',
            geojson.features.length
        );

        ocultarMensaje();
    }

    // =========================================
    // RECARGAR INFORMACIÓN
    // =========================================

    async function recargarDatos() {
        try {
            mostrarMensaje('Actualizando información...');

            await cargarDatosSheet();
            await cargarKML();

            mostrarMensaje(
                'Información actualizada correctamente.'
            );

            setTimeout(ocultarMensaje, 2500);

        } catch (error) {
            console.error(error);

            mostrarMensaje(
                'Error: ' + error.message
            );
        }
    }

    // =========================================
    // UBICACIÓN GPS
    // =========================================

    function localizarUsuario() {
        if (!navigator.geolocation) {
            mostrarMensaje(
                'Tu navegador no permite obtener la ubicación.'
            );
            return;
        }

        mostrarMensaje('Obteniendo ubicación GPS...');

        navigator.geolocation.getCurrentPosition(
            function(posicion) {
                const lat = posicion.coords.latitude;
                const lon = posicion.coords.longitude;

                const coordenadas = [lat, lon];

                if (marcadorUsuario) {
                    map.removeLayer(marcadorUsuario);
                }

                if (capaUbicacion) {
                    map.removeLayer(capaUbicacion);
                }

                capaUbicacion = L.circle(
                    coordenadas,
                    {
                        radius: posicion.coords.accuracy,
                        color: '#136aec',
                        fillColor: '#136aec',
                        fillOpacity: 0.12
                    }
                ).addTo(map);

                marcadorUsuario = L.marker(
                    coordenadas
                ).addTo(map);

                marcadorUsuario.bindPopup(
                    '<strong>Mi ubicación</strong>'
                ).openPopup();

                map.setView(
                    coordenadas,
                    18
                );

                mostrarMensaje(
                    'Ubicación obtenida correctamente.'
                );

                setTimeout(ocultarMensaje, 2500);
            },

            function(error) {
                let mensaje = 'No se pudo obtener tu ubicación.';

                if (error.code === 1) {
                    mensaje =
                        'Permite el acceso a tu ubicación en el navegador.';
                } else if (error.code === 2) {
                    mensaje =
                        'La ubicación no está disponible.';
                } else if (error.code === 3) {
                    mensaje =
                        'Se agotó el tiempo para obtener la ubicación.';
                }

                mostrarMensaje(mensaje);
            },

            {
                enableHighAccuracy: true,
                timeout: 15000,
                maximumAge: 0
            }
        );
    }

    // =========================================
    // INICIAR MAPA
    // =========================================

    async function iniciarMapa() {
        try {
            await cargarDatosSheet();
            await cargarKML();

            console.log(
                'Mapa iniciado correctamente.'
            );

        } catch (error) {
            console.error(error);

            mostrarMensaje(
                'Error al iniciar el mapa: ' +
                error.message
            );
        }
    }

    iniciarMapa();

</script>

</body>
</html>

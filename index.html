<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#174ea6">
<title>Mapa de negocios</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
<style>
*{box-sizing:border-box}html,body{height:100%;margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:#202124}body{display:flex;flex-direction:column}.top{background:#174ea6;color:white;padding:12px 14px;z-index:500;box-shadow:0 2px 8px #0002}.top h1{font-size:18px;margin:0}.top p{font-size:12px;margin:3px 0 0;opacity:.9}#map{flex:1;min-height:0;width:100%;background:#e8eaed}.actions{display:flex;gap:8px;padding:10px;background:#fff;box-shadow:0 -2px 8px #0001;z-index:500}.btn{border:0;border-radius:10px;padding:12px 14px;font-size:14px;font-weight:650;cursor:pointer;flex:1;background:#174ea6;color:white}.btn.secondary{background:#e8f0fe;color:#174ea6}.file-input{display:none}.status{font-size:12px;line-height:1.4;padding:7px 12px;background:#f8f9fa;border-top:1px solid #dadce0}.status.error{background:#fce8e6;color:#a50e0e}.status.ok{background:#e6f4ea;color:#137333}.leaflet-control-layers{border-radius:10px!important}.leaflet-popup-content{font-size:14px}.sheet-info{margin-top:8px;padding:8px;background:#e8f0fe;border-radius:8px}.sheet-info small{display:block;color:#5f6368;margin-bottom:3px}.leaflet-container{font:14px system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
</style>
</head>
<body>
<header class="top"><h1>Mapa de negocios</h1><p>Vista satelital · polígonos · Google Sheets · ubicación del dispositivo</p></header>
<div id="map" aria-label="Mapa interactivo"></div>
<div class="actions"><button class="btn" id="locate">📍 Mi ubicación</button><button class="btn secondary" id="pickKml">🗂️ Cargar KML del celular</button><input class="file-input" id="kmlFile" type="file" accept=".kml,application/vnd.google-earth.kml+xml,application/xml,text/xml"></div>
<div id="status" class="status">Preparando mapa…</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script src="https://unpkg.com/@tmcw/togeojson@5.8.1/dist/togeojson.umd.js"></script>
<script>
(() => {
 const statusEl=document.getElementById('status');
 const say=(msg,kind='')=>{statusEl.textContent=msg;statusEl.className='status '+kind;};
 const map=L.map('map',{zoomControl:true}).setView([31.025,-114.84],14);
 const SHEET_ID='1LdpC1hhub7cUcSq0EbiLFFKyDwQ68hhl9R4LRNSgqso';
 const SHEET_NAME='APPCEL';
 const cellCache={};
 // Satélite de Esri (no es Google Maps). El uso está sujeto a las condiciones y límites del proveedor.
 const satellite=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'Tiles © Esri — Source: Esri, Maxar, Earthstar Geographics, and the GIS User Community'}).addTo(map);
 const streets=L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'});
 let kmlLayer=L.geoJSON(null,{style:()=>({color:'#ff3b30',weight:3,opacity:.95,fillColor:'#ffcc00',fillOpacity:.28}),onEachFeature:(feature,layer)=>{let p=feature.properties||{};let polygonId=String(p.name||p.Name||p.id||'').trim();let rows=Object.entries(p).filter(([k,v])=>v!==null&&v!==''&&typeof v!=='object').map(([k,v])=>`<div><b>${esc(k)}:</b> ${esc(String(v))}</div>`).join('');layer.bindPopup(`<b>${esc(p.name||p.Name||'Polígono de estacionamientos')}</b>${rows}<div class="sheet-info" id="sheet-info-${escId(polygonId)}"><small>Google Sheets · pestaña APPCEL</small>${polygonId==='1'?'Consultando celda A4…':'Para este polígono aún no se configuró una celda.'}</div>`);if(polygonId==='1'){layer.on('click',()=>loadSheetCell('A4',`sheet-info-${escId(polygonId)}`));}}}).addTo(map);
 const overlays={'Polígonos: estacionamientos.kml':kmlLayer};
 L.control.layers({'Satélite':satellite,'Calles':streets},overlays,{collapsed:false,position:'topright'}).addTo(map);

 function escId(s){return String(s).replace(/[^a-zA-Z0-9_-]/g,'_');}
 async function loadSheetCell(range,elementId){
   const el=document.getElementById(elementId); if(!el)return;
   if(cellCache[range]!==undefined){el.innerHTML='<small>Google Sheets · pestaña APPCEL · '+range+'</small>'+esc(cellCache[range]||'(La celda está vacía)');return;}
   el.innerHTML='<small>Google Sheets · pestaña APPCEL · '+range+'</small>Consultando…';
   const url=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?sheet=${encodeURIComponent(SHEET_NAME)}&range=${encodeURIComponent(range)}&tqx=out:json`;
   try{
     const response=await fetch(url,{method:'GET'});
     if(!response.ok)throw new Error('Google respondió HTTP '+response.status);
     const raw=await response.text();
     const match=raw.match(/google\.visualization\.Query\.setResponse\((.*)\);?\s*$/s);
     if(!match)throw new Error('Google Sheets no devolvió datos legibles. Verifica que la hoja permita verla a cualquier persona con el enlace.');
     const data=JSON.parse(match[1]);
     if(data.status==='error')throw new Error(data.errors?.[0]?.detailed_message||'Error de consulta de Google Sheets.');
     const value=data.table?.rows?.[0]?.c?.[0]?.v;
     const formatted=data.table?.rows?.[0]?.c?.[0]?.f;
     const text=value==null?'':String(formatted??value);
     cellCache[range]=text;
     const current=document.getElementById(elementId);if(current)current.innerHTML='<small>Google Sheets · pestaña APPCEL · '+range+'</small>'+esc(text||'(La celda está vacía)');
   }catch(err){console.error(err);const current=document.getElementById(elementId);if(current)current.innerHTML='<small>Google Sheets · pestaña APPCEL · '+range+'</small>No se pudo leer la celda. Comprueba que la hoja esté compartida como “Cualquier persona con el enlace: lector”. Detalle: '+esc(err.message)+'<br><button type="button" id="retry-sheet" style="margin-top:6px">Reintentar</button>';const retry=document.getElementById('retry-sheet');if(retry)retry.onclick=()=>{delete cellCache[range];loadSheetCell(range,elementId);};}
 }

 function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
 // Carga manual desde el almacenamiento del dispositivo. Los navegadores no permiten
 // leer una ruta del celular directamente: el usuario debe elegir el archivo en el selector.
 function showKmlText(text, filename){
   const trimmed=text.trim();
   if(!trimmed.includes('<kml') && !trimmed.includes('<Placemark') && !trimmed.includes('<Document'))
     throw new Error('El archivo seleccionado no parece contener KML válido.');
   const xml=new DOMParser().parseFromString(text,'text/xml');
   if(xml.querySelector('parsererror')) throw new Error('No se pudo interpretar el archivo como XML/KML.');
   const geo=toGeoJSON.kml(xml);
   if(!geo.features || !geo.features.length) throw new Error('El KML no contiene elementos geográficos reconocibles.');
   kmlLayer.clearLayers();
   kmlLayer.addData(geo);
   if(!map.hasLayer(kmlLayer)) kmlLayer.addTo(map);
   const bounds=kmlLayer.getBounds();
   if(bounds.isValid()) map.fitBounds(bounds,{padding:[24,24],maxZoom:19});
   say(`Archivo ${filename} cargado: ${geo.features.length} elemento(s). Puedes activar u ocultar la capa desde el selector de capas.`, 'ok');
 }
 document.getElementById('pickKml').addEventListener('click',()=>document.getElementById('kmlFile').click());
 document.getElementById('kmlFile').addEventListener('change',event=>{
   const file=event.target.files && event.target.files[0];
   if(!file) return;
   if(!file.name.toLowerCase().endsWith('.kml')) { say('Selecciona un archivo con extensión .kml.', 'error'); event.target.value=''; return; }
   say('Leyendo '+file.name+'…');
   const reader=new FileReader();
   reader.onload=()=>{try{showKmlText(String(reader.result),file.name);}catch(err){console.error(err);say('No se pudo cargar el archivo: '+err.message,'error');}};
   reader.onerror=()=>say('El celular no pudo leer el archivo seleccionado. Intenta descargarlo primero en Archivos o Descargas.', 'error');
   reader.readAsText(file);
 });
 document.getElementById('locate').addEventListener('click',()=>{
   if(!('geolocation' in navigator)){say('Este navegador no ofrece geolocalización.','error');return;}
   if(!window.isSecureContext){say('El GPS requiere abrir esta página desde una dirección HTTPS (por ejemplo GitHub Pages).','error');return;}
   say('Solicitando permiso de ubicación…');
   navigator.geolocation.getCurrentPosition(pos=>{
     const lat=pos.coords.latitude,lon=pos.coords.longitude,acc=Math.round(pos.coords.accuracy);
     map.setView([lat,lon],18);
     if(window.userMarker)map.removeLayer(window.userMarker);if(window.userCircle)map.removeLayer(window.userCircle);
     window.userMarker=L.marker([lat,lon]).addTo(map).bindPopup(`Tu ubicación<br>Precisión aproximada: ${acc} m`).openPopup();
     window.userCircle=L.circle([lat,lon],{radius:acc,color:'#4285f4',fillColor:'#4285f4',fillOpacity:.12,weight:1}).addTo(map);
     say(`Ubicación obtenida. Precisión aproximada: ${acc} metros.`, 'ok');
   },err=>{const messages={1:'Permiso denegado. Autoriza ubicación para este sitio en los ajustes del navegador.',2:'No se pudo determinar la ubicación. Revisa GPS y conexión.',3:'La solicitud de ubicación agotó el tiempo de espera.'};say(messages[err.code]||('Error de ubicación: '+err.message),'error');},{enableHighAccuracy:true,timeout:20000,maximumAge:5000});
 });
 say('Mapa listo. Pulsa “Cargar KML del celular” y selecciona estacionamientos.kml.', '');
})();
</script>
</body></html>


<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#174ea6">

<title>Mapa de negocios</title>

<link rel="stylesheet"
 href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
 crossorigin="">

<style>
*{box-sizing:border-box}
html,body{
  height:100%;
  margin:0;
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
  color:#202124
}
body{display:flex;flex-direction:column}
.top{
  background:#174ea6;
  color:white;
  padding:12px 14px;
  z-index:500;
  box-shadow:0 2px 8px #0002
}
.top h1{font-size:18px;margin:0}
.top p{font-size:12px;margin:3px 0 0;opacity:.9}

#map{
  flex:1;
  min-height:0;
  width:100%;
  background:#e8eaed
}
.actions{
  display:flex;
  gap:8px;
  padding:10px;
  background:#fff;
  box-shadow:0 -2px 8px #0001;
  z-index:500
}
.btn{
  border:0;
  border-radius:10px;
  padding:12px 14px;
  font-size:14px;
  font-weight:650;
  cursor:pointer;
  flex:1;
  background:#174ea6;
  color:white
}
.btn.secondary{
  background:#e8f0fe;
  color:#174ea6
}
.status{
  font-size:12px;
  line-height:1.5;
  padding:8px 12px;
  background:#f8f9fa;
  border-top:1px solid #dadce0;
  overflow-wrap:anywhere
}
.status.error{background:#fce8e6;color:#a50e0e}
.status.ok{background:#e6f4ea;color:#137333}

.leaflet-control-layers{border-radius:10px!important}
.leaflet-popup-content{
  font-size:14px;
  overflow-wrap:anywhere
}
.leaflet-container{
  font:14px system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif
}
.sheet-info{
  margin-top:8px;
  padding:8px;
  background:#e8f0fe;
  border-radius:8px
}
.sheet-info small{
  display:block;
  color:#5f6368;
  margin-bottom:3px
}
@media(max-width:420px){
  .btn{padding:11px 8px;font-size:13px}
}
</style>
</head>

<body>

<header class="top">
  <h1>Mapa de negocios</h1>
  <p>Vista satelital · polígonos · ubicación del dispositivo</p>
</header>

<div id="map" aria-label="Mapa interactivo"></div>

<div class="actions">
  <button class="btn" id="locate" type="button">
    📍 Mi ubicación
  </button>

  <button class="btn secondary" id="reload" type="button">
    ↻ Recargar KML
  </button>
</div>

<div id="status" class="status" role="status" aria-live="polite">
  Preparando mapa…
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
 crossorigin=""></script>

<script src="https://unpkg.com/@tmcw/togeojson@5.8.1/dist/togeojson.umd.js"></script>

<script>
(() => {
'use strict';

const statusEl = document.getElementById('status');

const say = (msg, kind = '') => {
  statusEl.textContent = msg;
  statusEl.className = 'status ' + kind;
};

// Verificar librerías
if (!window.L || !window.toGeoJSON) {
  say('Error al cargar las librerías del mapa. Revisa tu conexión.', 'error');
  return;
}

// ==========================================
// CONFIGURACIÓN DEL MAPA
// ==========================================

const map = L.map('map', {
  zoomControl: true
}).setView([31.025, -114.84], 14);

// Mapa satelital Esri
const satellite = L.tileLayer(
  'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
  {
    maxZoom: 19,
    attribution: 'Tiles © Esri — Source: Esri, Maxar, Earthstar Geographics, and the GIS User Community'
  }
).addTo(map);

// Mapa de calles
const streets = L.tileLayer(
  'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
  {
    maxZoom: 19,
    attribution: '© OpenStreetMap contributors'
  }
);

// ==========================================
// CONFIGURACIÓN GOOGLE SHEETS
// ==========================================

const SHEET_ID = '1LdpC1hhub7cUcSq0EbiLFFKyDwQ68hhl9R4LRNSgqso';
const SHEET_NAME = 'APPCEL';
const cellCache = {};

// ==========================================
// CAPA DE POLÍGONOS KML
// ==========================================

let kmlLayer = L.geoJSON(null, {
  style: () => ({
    color: '#ff3b30',
    weight: 3,
    opacity: 0.95,
    fillColor: '#ffcc00',
    fillOpacity: 0.28
  }),

  onEachFeature: (feature, layer) => {
    const p = feature.properties || {};

    const polygonId = String(
      p.name || p.Name || p.id || ''
    ).trim();

    const title =
      p.name || p.Name || 'Polígono de estacionamientos';

    const rows = Object.entries(p)
      .filter(([k, v]) =>
        v !== null && v !== '' && typeof v !== 'object'
      )
      .map(([k, v]) =>
        `<div><b>${esc(k)}:</b> ${esc(String(v))}</div>`
      )
      .join('');

    let sheetInfo = '';

    if (polygonId === '1') {
      sheetInfo = `
        <div class="sheet-info" id="sheet-info-${escId(polygonId)}">
          <small>Google Sheets · pestaña APPCEL</small>
          Consultando celda A4…
        </div>`;
    } else {
      sheetInfo = `
        <div class="sheet-info">
          <small>Google Sheets · pestaña APPCEL</small>
          Para este polígono aún no se configuró una celda.
        </div>`;
    }

    layer.bindPopup(`
      <b>${esc(String(title))}</b>
      ${rows}
      ${sheetInfo}
    `);

    // Consulta de Google Sheets para el polígono con ID 1
    if (polygonId === '1') {
      layer.on('click', () => {
        loadSheetCell(
          'A4',
          `sheet-info-${escId(polygonId)}`
        );
      });
    }
  }
}).addTo(map);

// Selector de capas
const overlays = {
  'Polígonos: estacionamientos.kml': kmlLayer
};

L.control.layers(
  {
    'Satélite': satellite,
    'Calles': streets
  },
  overlays,
  {
    collapsed: false,
    position: 'topright'
  }
).addTo(map);

// ==========================================
// FUNCIONES DE SEGURIDAD HTML
// ==========================================

function esc(value) {
  return String(value).replace(/[&<>"']/g, c => ({
    '&': '&amp;',
    '<': '&lt;',
    '>': '&gt;',
    '"': '&quot;',
    "'": '&#39;'
  }[c]));
}

function escId(value) {
  return String(value).replace(/[^a-zA-Z0-9_-]/g, '_');
}

// ==========================================
// GOOGLE SHEETS
// ==========================================

async function loadSheetCell(range, elementId) {
  const el = document.getElementById(elementId);
  if (!el) return;

  if (cellCache[range] !== undefined) {
    el.innerHTML =
      '<small>Google Sheets · pestaña APPCEL · ' +
      esc(range) + '</small>' +
      esc(cellCache[range] || '(La celda está vacía)');
    return;
  }

  el.innerHTML =
    '<small>Google Sheets · pestaña APPCEL · ' +
    esc(range) + '</small>Consultando…';

  const url =
    `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?sheet=${encodeURIComponent(SHEET_NAME)}&range=${encodeURIComponent(range)}&tqx=out:json`;

  try {
    const response = await fetch(url);

    if (!response.ok) {
      throw new Error('Google respondió HTTP ' + response.status);
    }

    const raw = await response.text();

    const match = raw.match(
      /google\.visualization\.Query\.setResponse\((.*)\);?\s*$/s
    );

    if (!match) {
      throw new Error(
        'Google Sheets no devolvió datos legibles. Verifica los permisos de la hoja.'
      );
    }

    const data = JSON.parse(match[1]);

    if (data.status === 'error') {
      throw new Error(
        data.errors?.[0]?.detailed_message ||
        'Error de consulta de Google Sheets.'
      );
    }

    const cell = data.table?.rows?.[0]?.c?.[0];
    const value = cell?.v;
    const formatted = cell?.f;

    const result = value == null
      ? ''
      : String(formatted ?? value);

    cellCache[range] = result;

    const current = document.getElementById(elementId);

    if (current) {
      current.innerHTML =
        '<small>Google Sheets · pestaña APPCEL · ' +
        esc(range) + '</small>' +
        esc(result || '(La celda está vacía)');
    }

  } catch (err) {
    console.error(err);

    const current = document.getElementById(elementId);

    if (current) {
      current.innerHTML =
        '<small>Google Sheets · pestaña APPCEL · ' +
        esc(range) + '</small>' +
        'No se pudo leer la celda. Verifica que la hoja permita verla. ' +
        'Detalle: ' + esc(err.message) +
        '<br><button type="button" id="retry-sheet" style="margin-top:6px">Reintentar</button>';

      const retry = document.getElementById('retry-sheet');

      if (retry) {
        retry.onclick = () => {
          delete cellCache[range];
          loadSheetCell(range, elementId);
        };
      }
    }
  }
}

// ==========================================
// CARGA AUTOMÁTICA DEL ARCHIVO KML
// ==========================================

// IMPORTANTE:
// index.html y estacionamientos.kml deben estar
// en el mismo directorio publicado.
//
// GitHub Pages servirá el archivo relativo a esta página.
const KML_URL = new URL(
  'estacionamientos.kml',
  window.location.href
).href;

let loadSequence = 0;

async function loadKml() {
  const currentLoad = ++loadSequence;

  say('Cargando estacionamientos.kml…');

  try {
    const response = await fetch(KML_URL, {
      cache: 'no-store'
    });

    if (!response.ok) {
      throw new Error(
        `No se pudo encontrar el KML. HTTP ${response.status}.`
      );
    }

    const text = await response.text();

    // Detectar respuesta que no parece ser KML
    if (
      !text.trim() ||
      !/<(?:\w+:)?kml[\s>]/i.test(text)
    ) {
      throw new Error(
        'La respuesta no parece un archivo KML válido. Verifica la ruta y el nombre del archivo.'
      );
    }

    const xml = new DOMParser().parseFromString(
      text,
      'application/xml'
    );

    if (xml.querySelector('parsererror')) {
      throw new Error(
        'No se pudo interpretar el archivo como XML/KML.'
      );
    }

    const geo = toGeoJSON.kml(xml);

    if (!geo.features || !geo.features.length) {
      throw new Error(
        'El KML no contiene elementos geográficos reconocibles.'
      );
    }

    // Evitar que una carga anterior reemplace una nueva
    if (currentLoad !== loadSequence) return;

    kmlLayer.clearLayers();
    kmlLayer.addData(geo);

    if (!map.hasLayer(kmlLayer)) {
      kmlLayer.addTo(map);
    }

    const bounds = kmlLayer.getBounds();

    if (bounds.isValid()) {
      map.fitBounds(bounds, {
        padding: [24, 24],
        maxZoom: 19
      });
    }

    say(
      `KML cargado correctamente: ${geo.features.length} elemento(s).`,
      'ok'
    );

  } catch (err) {
    if (currentLoad !== loadSequence) return;

    console.error('Error al cargar KML:', err);

    say(
      'No se pudo cargar estacionamientos.kml. ' +
      'Verifica que el archivo esté junto al HTML, que el nombre coincida y que esté publicado. ' +
      'Detalle: ' + err.message,
      'error'
    );
  }
}

// Botón para volver a cargar los polígonos
document.getElementById('reload')
  .addEventListener('click', loadKml);

// ==========================================
// UBICACIÓN DEL DISPOSITIVO
// ==========================================

document.getElementById('locate')
  .addEventListener('click', () => {

  if (!('geolocation' in navigator)) {
    say(
      'Este navegador no ofrece geolocalización.',
      'error'
    );
    return;
  }

  if (!window.isSecureContext) {
    say(
      'El GPS requiere abrir esta página desde HTTPS o localhost.',
      'error'
    );
    return;
  }

  say('Solicitando permiso de ubicación…');

  navigator.geolocation.getCurrentPosition(
    pos => {
      const lat = pos.coords.latitude;
      const lon = pos.coords.longitude;
      const accuracy = Math.round(pos.coords.accuracy);

      map.setView([lat, lon], 18);

      if (window.userMarker) {
        map.removeLayer(window.userMarker);
      }

      if (window.userCircle) {
        map.removeLayer(window.userCircle);
      }

      window.userMarker = L.marker([lat, lon])
        .addTo(map)
        .bindPopup(
          `Tu ubicación<br>Precisión aproximada: ${accuracy} m`
        )
        .openPopup();

      window.userCircle = L.circle([lat, lon], {
        radius: accuracy,
        color: '#4285f4',
        fillColor: '#4285f4',
        fillOpacity: .12,
        weight: 1
      }).addTo(map);

      say(
        `Ubicación obtenida. Precisión aproximada: ${accuracy} metros.`,
        'ok'
      );
    },

    err => {
      const messages = {
        1: 'Permiso denegado. Autoriza ubicación en los ajustes del navegador.',
        2: 'No se pudo determinar la ubicación. Revisa GPS y conexión.',
        3: 'La solicitud de ubicación agotó el tiempo de espera.'
      };

      say(
        messages[err.code] ||
        ('Error de ubicación: ' + err.message),
        'error'
      );
    },

    {
      enableHighAccuracy: true,
      timeout: 20000,
      maximumAge: 5000
    }
  );
});

// ==========================================
// INICIO AUTOMÁTICO
// ==========================================

loadKml();

})();
</script>

</body>
</html>

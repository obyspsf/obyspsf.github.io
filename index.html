
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Estacionamientos</title>

    <!-- Leaflet -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
        }

        header {
            background: #17365d;
            color: white;
            padding: 14px 18px;
            text-align: center;
        }

        header h2 {
            margin: 0;
            font-size: 20px;
        }

        #barra {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            align-items: center;
            padding: 10px;
            background: white;
            box-shadow: 0 2px 5px #0002;
        }

        button {
            border: none;
            border-radius: 5px;
            padding: 10px 14px;
            cursor: pointer;
            color: white;
            background: #17365d;
            font-size: 14px;
        }

        button:hover {
            opacity: 0.9;
        }

        #btnGPS {
            background: #218838;
        }

        #btnRecargar {
            background: #007bff;
        }

        #mensaje {
            padding: 8px 12px;
            text-align: center;
            font-size: 13px;
            color: #333;
            background: #fff;
        }

        #map {
            width: 100%;
            height: calc(100vh - 155px);
            min-height: 400px;
        }

        /* Cuadro de información */
        .popup-info {
            min-width: 220px;
            max-width: 300px;
            font-family: Arial, sans-serif;
            line-height: 1.5;
        }

        .popup-info h3 {
            font-size: 16px;
            margin: 0 0 10px 0;
            padding-bottom: 8px;
            border-bottom: 1px solid #ddd;
            color: #17365d;
        }

        .popup-info p {
            margin: 7px 0;
            font-size: 13px;
            overflow-wrap: anywhere;
        }

        .status {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 12px;
        }

        .status-pagado {
            color: #155724;
            background: #d4edda;
        }

        .status-no-pagado {
            color: #721c24;
            background: #f8d7da;
        }

        .status-desconocido {
            color: #383d41;
            background: #e2e3e5;
        }

        .sin-info {
            color: #856404;
            background: #fff3cd;
            padding: 8px;
            border-radius: 4px;
            font-size: 13px;
        }

        @media (max-width: 600px) {
            header h2 {
                font-size: 17px;
            }

            #map {
                height: calc(100vh - 190px);
            }

            button {
                padding: 9px 10px;
                font-size: 12px;
            }
        }
    </style>
</head>

<body>

<header>
    <h2>CONTROL DE ESTACIONAMIENTOS</h2>
</header>

<div id="barra">
    <button id="btnGPS">Mi ubicación</button>
    <button id="btnRecargar">Recargar información</button>
</div>

<div id="mensaje">
    Iniciando mapa...
</div>

<div id="map"></div>

<!-- Leaflet -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<!-- Conversión de KML a GeoJSON -->
<script src="https://unpkg.com/@tmcw/togeojson@5.8.1/dist/togeojson.umd.js"></script>

<script>
    // ==========================================
    // CONFIGURACIÓN
    // ==========================================

    const SHEET_ID =
        '1LdpC1hhub7cUcSq0EbiLFFKyDwQ68hhl9R4LRNSgqso';

    const SHEET_NAME = 'APPCEL';

    // El archivo estacionamientos.kml debe estar
    // en la misma carpeta que index.html.
    const KML_URL = new URL(
        'estacionamientos.kml',
        window.location.href
    ).href;

    // Información de contribuyentes
    let datosContribuyentes = {};

    // Capa de estacionamientos
    let capaEstacionamientos = null;

    // Ubicación del usuario
    let marcadorGPS = null;
    let circuloGPS = null;

    // Mapa
    const map = L.map('map');

    // ==========================================
// MAPAS BASE DE MEJOR DETALLE
// ==========================================

// Imágenes satelitales
const mapaSatelital = L.tileLayer(
    'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
    {
        attribution: 'Tiles &copy; Esri',
        maxZoom: 22,
        maxNativeZoom: 19
    }
);

// Nombres de calles y lugares sobre el satélite
const etiquetas = L.tileLayer(
    'https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}',
    {
        attribution: 'Etiquetas &copy; Esri',
        maxZoom: 22,
        maxNativeZoom: 19,
        pane: 'overlayPane'
    }
);

// Mapa de calles alternativo
const mapaCalles = L.tileLayer(
    'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
    {
        attribution: '&copy; OpenStreetMap',
        maxZoom: 19
    }
);

// Iniciar en modo híbrido
mapaSatelital.addTo(map);
etiquetas.addTo(map);

// Selector de mapas
L.control.layers(
    {
        'Satélite': mapaSatelital,
        'Híbrido (satélite + etiquetas)': L.layerGroup([
            mapaSatelital,
            etiquetas
        ]),
        'Calles': mapaCalles
    },
    {},
    { collapsed: true }
).addTo(map);
    // ==========================================
    // MENSAJES
    // ==========================================

    function mostrarMensaje(texto) {
        document.getElementById('mensaje').textContent = texto;
    }

    // ==========================================
    // NORMALIZAR ID
    // ==========================================

    function normalizarID(valor) {
        if (valor === null || valor === undefined) {
            return '';
        }

        return String(valor).trim();
    }

    // ==========================================
    // ESCAPAR TEXTO PARA HTML
    // ==========================================

    function escaparHTML(valor) {
        return String(valor ?? '').replace(/[&<>"']/g, function (caracter) {
            const entidades = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#39;'
            };

            return entidades[caracter];
        });
    }

    // ==========================================
    // LEER GOOGLE SHEETS
    // ==========================================

    async function cargarDatosSheet() {
        mostrarMensaje('Cargando información de Google Sheets...');

        const url = new URL(
            `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq`
        );

        url.searchParams.set('sheet', SHEET_NAME);
        url.searchParams.set('range', 'A2:D');
        url.searchParams.set('headers', '0');
        url.searchParams.set('tqx', 'out:json');

        const respuesta = await fetch(url.toString());

        if (!respuesta.ok) {
            throw new Error(
                'No se pudo consultar Google Sheets. Verifica los permisos.'
            );
        }

        const texto = await respuesta.text();

        // Google Visualization devuelve JSON envuelto.
        const inicio = texto.indexOf('{');
        const fin = texto.lastIndexOf('}');

        if (inicio === -1 || fin === -1) {
            throw new Error('Respuesta inválida de Google Sheets.');
        }

        const resultado = JSON.parse(
            texto.substring(inicio, fin + 1)
        );

        if (resultado.status !== 'ok' || !resultado.table) {
            throw new Error(
                'No se pudieron leer los datos de Google Sheets.'
            );
        }

        const registros = {};

        (resultado.table.rows || []).forEach(function (fila) {
            const celdas = fila.c || [];

            // Columnas:
            // A = ID
            // B = Nombre
            // C = Localización
            // D = Status

            const id = celdas[0]?.v;

            const nombre =
                celdas[1]?.f ?? celdas[1]?.v ?? '';

            const localizacion =
                celdas[2]?.f ?? celdas[2]?.v ?? '';

            const status =
                celdas[3]?.f ?? celdas[3]?.v ?? '';

            const clave = normalizarID(id);

            if (!clave) {
                return;
            }

            registros[clave] = {
                id: clave,
                nombre: String(nombre ?? ''),
                localizacion: String(localizacion ?? ''),
                status: String(status ?? '')
            };
        });

        datosContribuyentes = registros;

        console.log(
            'Información de Google Sheets:',
            datosContribuyentes
        );

        console.log(
            'IDs encontrados:',
            Object.keys(datosContribuyentes)
        );

        return datosContribuyentes;
    }

    // ==========================================
    // OBTENER ID DEL POLÍGONO
    // ==========================================

    function obtenerIdPoligono(feature) {
        const propiedades = feature.properties || {};

        // El nombre del polígono KML es el ID.
        // Ejemplo: nombre = "1"
        return normalizarID(propiedades.name ?? '');
    }

    // ==========================================
    // BUSCAR INFORMACIÓN DEL POLÍGONO
    // ==========================================

    function obtenerInformacionPoligono(feature) {
        const id = obtenerIdPoligono(feature);

        return datosContribuyentes[id] || null;
    }

    // ==========================================
    // CLASIFICAR STATUS
    // ==========================================

    function obtenerClaseStatus(status) {
        const valor = String(status ?? '')
            .trim()
            .toUpperCase()
            .normalize('NFD')
            .replace(/[\u0300-\u036f]/g, '');

        // Revisar primero NO PAGADO
        if (
            valor.includes('NO PAGADO') ||
            valor.includes('NO_PAGADO') ||
            valor.includes('PENDIENTE') ||
            valor.includes('ADEUDO')
        ) {
            return 'status-no-pagado';
        }

        if (
            valor === 'PAGADO' ||
            valor === 'PAGADA' ||
            valor === 'PAID'
        ) {
            return 'status-pagado';
        }

        return 'status-desconocido';
    }

    // ==========================================
    // CREAR CUADRO DE INFORMACIÓN
    // ==========================================

    function crearPopup(info) {

        if (!info) {
            return `
                <div class="popup-info">
                    <h3>Sin información</h3>
                    <div class="sin-info">
                        No se encontró información
                        para este estacionamiento
                        en Google Sheets.
                    </div>
                </div>
            `;
        }

        const nombre = escaparHTML(
            info.nombre || 'Sin nombre'
        );

        const localizacion = escaparHTML(
            info.localizacion || 'Sin localización'
        );

        const statusOriginal = String(
            info.status || ''
        ).trim();

        const status = escaparHTML(
            statusOriginal || 'SIN ESTATUS'
        );

        const claseStatus = obtenerClaseStatus(
            statusOriginal
        );

        // Título: Nombre del contribuyente.
        // No mostrar ID.
        // No mostrar "Estacionamiento 1".

        return `
            <div class="popup-info">

                <h3>${nombre}</h3>

                <p>
                    <strong>Localización:</strong><br>
                    ${localizacion}
                </p>

                <p>
                    <strong>Status:</strong><br>
                    <span class="status ${claseStatus}">
                        ${status}
                    </span>
                </p>

            </div>
        `;
    }

    // ==========================================
    // ESTILO DE LOS POLÍGONOS
    // ==========================================

    function estiloPoligono(feature) {
        const info = obtenerInformacionPoligono(feature);

        if (!info) {
            return {
                color: '#007bff',
                weight: 2,
                fillColor: '#007bff',
                fillOpacity: 0.35
            };
        }

        const clase = obtenerClaseStatus(info.status);

        if (clase === 'status-pagado') {
            return {
                color: '#008000',
                weight: 2,
                fillColor: '#28a745',
                fillOpacity: 0.45
            };
        }

        if (clase === 'status-no-pagado') {
            return {
                color: '#b30000',
                weight: 2,
                fillColor: '#dc3545',
                fillOpacity: 0.45
            };
        }

        return {
            color: '#e0a800',
            weight: 2,
            fillColor: '#ffc107',
            fillOpacity: 0.4
        };
    }

    // ==========================================
    // CARGAR KML
    // ==========================================

    async function cargarKML() {
        mostrarMensaje('Cargando estacionamientos...');

        const respuesta = await fetch(KML_URL, {
            cache: 'no-store'
        });

        if (!respuesta.ok) {
            throw new Error(
                'No se pudo cargar estacionamientos.kml. Verifica que esté junto a index.html.'
            );
        }

        const textoKML = await respuesta.text();

        const parser = new DOMParser();

        const documentoKML = parser.parseFromString(
            textoKML,
            'application/xml'
        );

        if (
            documentoKML.querySelector('parsererror') ||
            !documentoKML.documentElement
        ) {
            throw new Error('El archivo KML no es válido.');
        }

        const geojson = toGeoJSON.kml(documentoKML);

        if (!geojson.features || geojson.features.length === 0) {
            throw new Error(
                'El archivo KML no contiene elementos geográficos.'
            );
        }

        // Eliminar capa anterior
        if (capaEstacionamientos) {
            map.removeLayer(capaEstacionamientos);
        }

        // Crear capa de estacionamientos
        capaEstacionamientos = L.geoJSON(geojson, {
            style: estiloPoligono,

            onEachFeature: function (feature, layer) {

                const info = obtenerInformacionPoligono(feature);

                // El cuadro muestra directamente el nombre.
                layer.bindPopup(crearPopup(info));

                // Resaltar al pasar el cursor
                layer.on('mouseover', function () {
                    if (layer.setStyle) {
                        layer.setStyle({
                            weight: 4
                        });
                    }
                });

                layer.on('mouseout', function () {
                    if (capaEstacionamientos) {
                        capaEstacionamientos.resetStyle(layer);
                    }
                });
            }
        }).addTo(map);

        // Ajustar mapa a los estacionamientos
        const limites = capaEstacionamientos.getBounds();

        if (limites.isValid()) {
            map.fitBounds(limites, {
                padding: [20, 20],
                maxZoom: 19
            });
        }

        return geojson;
    }

    // ==========================================
    // RECARGAR INFORMACIÓN
    // ==========================================

    async function recargarInformacion() {
        const boton = document.getElementById('btnRecargar');

        boton.disabled = true;
        boton.textContent = 'Cargando...';

        try {
            await cargarDatosSheet();
            await cargarKML();

            mostrarMensaje(
                'Mapa actualizado correctamente. ' +
                Object.keys(datosContribuyentes).length +
                ' registros encontrados.'
            );

        } catch (error) {
            console.error(error);

            mostrarMensaje(
                'Error: ' + error.message
            );

        } finally {
            boton.disabled = false;
            boton.textContent = 'Recargar información';
        }
    }

    // ==========================================
    // UBICACIÓN GPS
    // ==========================================

    function obtenerUbicacion() {
        if (!navigator.geolocation) {
            alert(
                'Tu navegador no permite obtener la ubicación.'
            );
            return;
        }

        mostrarMensaje('Obteniendo ubicación GPS...');

        navigator.geolocation.getCurrentPosition(
            function (posicion) {
                const lat = posicion.coords.latitude;
                const lng = posicion.coords.longitude;
                const precision = posicion.coords.accuracy;

                const ubicacion = [lat, lng];

                // Centrar mapa
                map.setView(ubicacion, 19);

                // Eliminar marcadores anteriores
                if (marcadorGPS) {
                    map.removeLayer(marcadorGPS);
                }

                if (circuloGPS) {
                    map.removeLayer(circuloGPS);
                }

                // Marcador de ubicación
                marcadorGPS = L.marker(ubicacion)
                    .addTo(map)
                    .bindPopup('Tu ubicación actual');

                marcadorGPS.openPopup();

                // Radio de precisión
                circuloGPS = L.circle(ubicacion, {
                    radius: precision,
                    color: '#007bff',
                    fillColor: '#007bff',
                    fillOpacity: 0.1
                }).addTo(map);

                mostrarMensaje(
                    'Ubicación obtenida. Precisión aproximada: ' +
                    Math.round(precision) + ' metros.'
                );
            },

            function (error) {
                console.error(error);

                let mensaje = 'No se pudo obtener la ubicación.';

                if (error.code === 1) {
                    mensaje =
                        'Permite el acceso a la ubicación en tu navegador.';
                } else if (error.code === 2) {
                    mensaje =
                        'La ubicación no está disponible.';
                } else if (error.code === 3) {
                    mensaje =
                        'Se agotó el tiempo para obtener la ubicación.';
                }

                mostrarMensaje(mensaje);
            },

            {
                enableHighAccuracy: true,
                timeout: 15000,
                maximumAge: 0
            }
        );
    }

    // ==========================================
    // BOTONES
    // ==========================================

    document.getElementById('btnGPS')
        .addEventListener('click', obtenerUbicacion);

    document.getElementById('btnRecargar')
        .addEventListener('click', recargarInformacion);

    // ==========================================
    // INICIAR
    // ==========================================

    recargarInformacion();

</script>

</body>
</html>
